<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <meta name="description" content="AutoHaul - Premium Vehicle Shipping & Auto Transport HTML Template">
    <title>Login | AutoHaul</title>
    <!-- Theme & RTL Initialization -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
            const savedDir = localStorage.getItem('dir');
            if(savedDir) document.documentElement.setAttribute('dir', savedDir);
        })();
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css?v=1791522762" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css?v=1791522762">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css?v=1791522762">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css?v=1791522762" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css?v=1791522762" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css?v=1791522762">
    <link rel="stylesheet" href="assets/css/responsive.css?v=1791522762">
    <link rel="stylesheet" href="assets/css/dark-mode.css?v=1791522762">
    <link rel="stylesheet" href="assets/css/rtl.css?v=1791522762">
    
</head>
<body class="bg-white">
<div class="main-wrapper d-flex flex-column min-vh-100" >

    <section class="min-vh-100 bg-light d-flex align-items-center position-relative">
        <!-- Desktop RTL & Theme Toggles -->
        <div class="position-absolute top-0 end-0 p-4 z-3 d-none d-md-flex gap-3">
            <button class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px;" onclick="document.documentElement.setAttribute('dir', document.documentElement.getAttribute('dir') === 'rtl' ? 'ltr' : 'rtl');" title="Toggle RTL">
                <span class="fw-bold text-dark" style="font-size: 0.75rem;">RTL</span>
            </button>
            <button class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center border fs-5 text-dark" style="width: 40px; height: 40px;" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');" title="Toggle Theme">
                <i class="bi bi-moon-stars"></i>
            </button>
        </div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none d-inline-block mb-3">
                                <div class="d-flex align-items-center justify-content-center mb-3"><img src="assets/images/logo_icon.png" alt="Company Logo" style="height: 48px; width: auto; object-fit: contain;" class="me-2"><span class="text-navy ms-2" style="font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: -0.5px; font-size: 2.2rem;">Auto<span class="text-primary">Haul</span></span></div>
                            </a>
                            <h2 class="fw-bold text-navy">Welcome Back</h2>
                            <p class="text-secondary">Sign in to your AutoHaul dashboard</p>
                        </div>
                        


                        <form onsubmit="event.preventDefault(); new bootstrap.Modal(document.getElementById('loginSuccessModal')).show();">
                            <div class="mb-3 text-start">
                                <label class="form-label fw-semibold text-dark">Email address</label>
                                <input type="email" class="form-control form-control-lg bg-light border-0" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4 text-start">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label class="form-label fw-semibold text-dark">Password</label>
                                    <a href="forgot-password.html" class="text-decoration-none small text-primary fw-semibold">Forgot password?</a>
                                </div>
                                <input type="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" required>
                            </div>
                            <div class="mb-4 form-check text-start">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm text-uppercase tracking-wider">Sign In</button>
                            
                                                    <div class="position-relative mb-4 mt-4 text-center">
                            <hr class="text-secondary opacity-25">
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-secondary small fw-semibold">or continue with</span>
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-3 mb-4">
                            <button type="button" class="btn btn-outline-secondary w-100 fw-bold d-flex align-items-center justify-content-center gap-2 hover-bg-light">
                                <i class="bi bi-google text-danger"></i> Google
                            </button>
                            <button type="button" class="btn btn-outline-secondary w-100 fw-bold d-flex align-items-center justify-content-center gap-2 hover-bg-light">
                                <i class="bi bi-apple fs-5 text-dark"></i> Apple
                            </button>
                        </div>

                            <div class="text-center mt-4">
                                <span class="text-secondary">Don't have an account?</span>
                                <a href="register.html" class="text-decoration-none fw-bold text-primary ms-1">Create an account</a>
                            </div>
                        </form>
                    </div>

                    <!-- Mobile Theme & RTL Toggles (Under Card) -->
                    <div class="d-flex d-md-none justify-content-center align-items-center gap-3 mt-4">
                        <button class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px;" onclick="document.documentElement.setAttribute('dir', document.documentElement.getAttribute('dir') === 'rtl' ? 'ltr' : 'rtl');" title="Toggle RTL">
                            <span class="fw-bold text-dark" style="font-size: 0.75rem;">RTL</span>
                        </button>
                        <button class="btn btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center border fs-5 text-dark" style="width: 40px; height: 40px;" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');" title="Toggle Theme">
                            <i class="bi bi-moon-stars"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Login Success Modal -->
        <div class="modal fade" id="loginSuccessModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg rounded-4 text-center p-4 p-md-5">
                    <div class="modal-body">
                        <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <h3 class="fw-bold text-navy mb-3">Login Successful!</h3>
                        <p class="text-secondary mb-4">Welcome back to AutoHaul. You have successfully authenticated.</p>
                        <button type="button" class="btn btn-primary btn-lg w-100 fw-bold text-uppercase tracking-wider shadow-sm" data-bs-dismiss="modal" onclick="this.closest('form')?.reset()">Continue</button>
                    </div>
                </div>
            </div>
        </div>
</section>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js?v=1791522762"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js?v=1791522762"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js?v=1791522762"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js?v=1791522762"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js?v=1791522762"></script>
    
    <script src="assets/js/storage.js?v=1791522762"></script>
    <script src="assets/js/mock-data.js?v=1791522762"></script>
    <script src="assets/js/theme.js?v=1791522762"></script>
    <script src="assets/js/rtl.js?v=1791522762"></script>
    <script src="assets/js/main.js?v=1791522762"></script>
    <script src="assets/js/navigation.js?v=1791522762"></script>
    <script src="assets/js/forms.js?v=1791522762"></script>
    <script src="assets/js/quote-calculator.js?v=1791522762"></script>
    <script src="assets/js/tracking.js?v=1791522762"></script>
    <script src="assets/js/booking.js?v=1791522762"></script>
    <script src="assets/js/blog.js?v=1791522762"></script>
    
    
    <script>
        AOS.init({
            once: true,
            offset: 50,
            duration: 800
        });
    </script>
</div>
</div>
</body>
</html>
